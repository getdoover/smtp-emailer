[project]
name = "smtp-emailer"
version = "0.1.0"
description = "Sends emails via SMTP when a message is published to the send-email channel. Supports recipient, subject, body, cc, and attachment fields."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=1.1.0",
]

[project.scripts]
export-config = "smtp_emailer.app_config:export"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiohttp>=3.11.18",
    "grpcio>=1.71.0",
    "protobuf>=6.30.2",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "requests>=2.32.3",
]
